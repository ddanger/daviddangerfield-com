name: Build and Format Guardrails

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dist/ isn't committed — this just confirms the build still succeeds.
      - name: Build
        run: npm run build

      - name: Verify formatting
        run: npm run format:check
