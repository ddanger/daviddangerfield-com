name: PR Quality Gates

on:
  pull_request:
    branches:
      - main

jobs:
  source-validation:
    name: Source Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate Source Contracts
        run: node scripts/validate-source.mjs

      - name: Run tests
        run: npm test
